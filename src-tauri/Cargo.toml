[package]
name = "dbman"
version = "1.4.2"
description = "唐三浪DBMan - 基于 Tauri + Rust 的现代桌面数据库管理工具"
authors = ["tangsanlang"]
license = "MIT"
repository = "https://github.com/usheweb/dbman"
homepage = "http://dbman.tangsanlang.com/"
edition = "2021"
# keyring 4.x 要求 1.88，抬高 MSRV 以如实反映可编译的最低工具链
rust-version = "1.88"

[lib]
name = "dbman_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"

tokio = { version = "1", features = ["net", "io-util", "sync", "rt", "time", "macros"] }
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }

# MySQL：文本协议执行任意 SQL（含 SHOW / USE / 多语句），按行返回
mysql_async = { version = "0.34", default-features = false, features = ["default-rustls"] }
# Redis：ConnectionManager 内部多路复用，Clone 廉价
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager"] }
# SSH 隧道：纯 Rust 实现，无系统库依赖
russh = "0.45"
rand = "0.8"
# russh::client::Handler 由 #[async_trait] 生成，实现端需同名宏
async-trait = "0.1"
# 导出时间戳列时按本地时区格式化
chrono = { version = "0.4", features = ["clock"] }
# 大模型 HTTP 客户端：rustls 避免引入 OpenSSL 系统库，保持体积可控
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
encoding_rs = { version = "0.8.35", default-features = false, features = ["alloc"] }
tokio-postgres = { version = "0.7", default-features = false, features = ["runtime", "with-chrono-0_4", "with-serde_json-1"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
tiberius = { version = "0.12", default-features = false, features = ["rustls", "tds73", "chrono"] }
tokio-util = { version = "0.7", features = ["compat"] }
oracle = { version = "0.6", default-features = false, features = ["chrono"] }
# MongoDB：官方驱动，bson 由它转出；rustls 避免引入 OpenSSL 系统库。
# 锁在 3.2.x：更高的 3.9.x 在本机工具链下编译失败（crate 自身报错）
mongodb = { version = "~3.2", default-features = false, features = ["rustls-tls", "compat-3-0-0"] }
# 系统安全存储：数据库密码 / SSH 密码与私钥 / AI apiKey 存进系统钥匙串，不落盘。
# v1 特性会自动选平台实现：macOS Keychain、Windows 凭据管理器、Linux Secret Service（zbus，纯 Rust）
keyring = { version = "4", default-features = false, features = ["v1"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
