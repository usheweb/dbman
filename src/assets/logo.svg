<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DBMan">
  <defs>
    <!-- 底色渐变：左上青 → 右下紫（沿用现用蓝底） -->
    <linearGradient id="bg" gradientUnits="userSpaceOnUse" x1="31" y1="31" x2="377" y2="550">
      <stop offset="0%" stop-color="#5BC9F3"/>
      <stop offset="100%" stop-color="#725AF5"/>
    </linearGradient>
    <!-- 光晕遮罩：小圆挖掉一个更大的偏移圆 → 右上平滑月牙（尖端与底盘外缘齐平，无尖刺） -->
    <mask id="halo">
      <rect width="512" height="512" fill="#000000"/>
      <circle cx="256" cy="256" r="75" fill="#FFFFFF"/>
      <circle cx="233.6" cy="304" r="114" fill="#000000"/>
    </mask>
  </defs>

  <!-- 外框：圆角方形 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 轨道：被 4 个数据库节点打断的断环（4 段弧，缺口 38° / 弧段 52°） -->
  <path d="M207.8 395.9 A148 148 0 0 1 116.1 304.2" fill="none" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="26" stroke-linecap="round"/>
  <path d="M116.1 207.8 A148 148 0 0 1 207.8 116.1" fill="none" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="26" stroke-linecap="round"/>
  <path d="M304.2 116.1 A148 148 0 0 1 395.9 207.8" fill="none" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="26" stroke-linecap="round"/>
  <path d="M395.9 304.2 A148 148 0 0 1 304.2 395.9" fill="none" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="26" stroke-linecap="round"/>

  <!-- 正下：圆柱 = 关系型（MySQL / PostgreSQL / Oracle） -->
  <path d="M231 404 v30 a25 10 0 0 0 50 0 v-30 z" fill="#FFFFFF"/>
  <ellipse cx="256" cy="404" rx="25" ry="10" fill="#DFEEFB"/>

  <!-- 正左：六边形 = 宽列 / 分布式（Cassandra / HBase） -->
  <polygon points="108,229 131.4,242.5 131.4,269.5 108,283 84.6,269.5 84.6,242.5" fill="#FFFFFF"/>

  <!-- 正上：叶子 = 文档型（MongoDB） -->
  <path d="M256 80 C282 92 282 124 256 136 C230 124 230 92 256 80 Z" fill="#FFFFFF"/>

  <!-- 正右：堆叠板 = 键值 / 缓存（Redis / Memcached） -->
  <rect x="378" y="232.5" width="52" height="13" rx="4" fill="#FFFFFF"/>
  <rect x="378" y="249.5" width="52" height="13" rx="4" fill="#DFEEFB"/>
  <rect x="378" y="266.5" width="52" height="13" rx="4" fill="#FFFFFF"/>

  <!-- 品牌机器人：原样完整保留（黑色头部 / 浅蓝双眼 / 两侧耳环 / 浅蓝光晕底盘） -->
  <circle cx="256" cy="256" r="75" fill="#ACE0F9"/>
  <circle cx="256" cy="256" r="75" fill="#E9F6FE" mask="url(#halo)"/>
  <ellipse cx="182.4" cy="261.4" rx="15.4" ry="25.5" fill="#000000"/>
  <ellipse cx="182.4" cy="261.4" rx="8.5" ry="18.6" fill="#ACE0F9"/>
  <ellipse cx="329.6" cy="261.4" rx="15.4" ry="25.5" fill="#000000"/>
  <ellipse cx="329.6" cy="261.4" rx="8.5" ry="18.6" fill="#ACE0F9"/>
  <circle cx="256" cy="256" r="52" fill="#000000"/>
  <ellipse cx="236.7" cy="244" rx="6.8" ry="14" fill="#ACE0F9"/>
  <ellipse cx="275.3" cy="244" rx="6.8" ry="14" fill="#ACE0F9"/>
</svg>
