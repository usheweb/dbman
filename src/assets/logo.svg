<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="DBMan">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="66%">
      <stop offset="0%" stop-color="#12657F"/>
      <stop offset="62%" stop-color="#0A3F58"/>
      <stop offset="100%" stop-color="#06182A"/>
    </radialGradient>
    <linearGradient id="cyl" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#57CBEE"/>
      <stop offset="100%" stop-color="#2A80BC"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0%" stop-color="#9BDF9B"/>
      <stop offset="100%" stop-color="#5FAD66"/>
    </linearGradient>
    <clipPath id="bodyClip">
      <path d="M150 170 L150 322 C150 343 197 360 256 360 C315 360 362 343 362 322 L362 170 Z"/>
    </clipPath>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- 装饰环 + 光点 -->
  <circle cx="256" cy="252" r="178" fill="none" stroke="#9FE9FF" stroke-width="4" opacity="0.12"/>
  <circle cx="118" cy="150" r="9" fill="#CFEFFF" opacity="0.18"/>
  <circle cx="404" cy="128" r="6" fill="#CFEFFF" opacity="0.16"/>
  <circle cx="418" cy="330" r="11" fill="#F2C94C" opacity="0.85"/>
  <circle cx="104" cy="352" r="8" fill="#B79CE8" opacity="0.8"/>

  <!-- 茎 -->
  <path d="M256 128 L256 104" stroke="#6E9463" stroke-width="12" stroke-linecap="round"/>

  <!-- 叶子 -->
  <ellipse cx="300" cy="104" rx="42" ry="21" fill="url(#leaf)" transform="rotate(-26 300 104)"/>
  <ellipse cx="212" cy="100" rx="40" ry="20" fill="#6FBB70" transform="rotate(28 212 100)"/>

  <!-- 数据库圆柱（"数据果实"） -->
  <path d="M150 170 L150 322 C150 343 197 360 256 360 C315 360 362 343 362 322 L362 170 Z" fill="url(#cyl)"/>
  <ellipse cx="256" cy="340" rx="96" ry="30" fill="#0F4A72" opacity="0.25" clip-path="url(#bodyClip)"/>
  <ellipse cx="256" cy="170" rx="106" ry="38" fill="#7FE8FA"/>
  <ellipse cx="212" cy="158" rx="38" ry="14" fill="#FFFFFF" opacity="0.32" transform="rotate(-10 212 158)"/>
  <path d="M150 222 C150 243 197 260 256 260 C315 260 362 243 362 222" fill="none" stroke="#A9EFFF" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
  <path d="M150 274 C150 295 197 312 256 312 C315 312 362 295 362 274" fill="none" stroke="#A9EFFF" stroke-width="7" stroke-linecap="round" opacity="0.55"/>
</svg>
